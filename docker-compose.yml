version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: rentwise_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rentwise_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./server/src/database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rentwise_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: rentwise_db
      JWT_SECRET: rentwise_production_secret_key_2026
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mysql
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rentwise_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
